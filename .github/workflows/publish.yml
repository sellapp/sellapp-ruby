# Generated manual publication; pushes and tags never publish automatically.
name: Publish validated RubyGems package
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the validated package assets (vX.Y.Z)
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 from the reviewed local publication manifest
        required: true
        type: string
      publish:
        description: Upload to RubyGems after verification (leave unchecked for verification only)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ruby-rubygems-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'sellapp/sellapp-ruby' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.verified_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify retained package hashes and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python3 .github/scripts/verify-ruby-publication.py --tag "$RELEASE_TAG" --sha256 "$MANIFEST_SHA256"
      - name: Retain verified distributions
        id: verified_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-rubygems-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    if: inputs.publish && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: rubygems
      url: https://rubygems.org/gems/sellapp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: dist/
      - name: Set up the publishing client
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: 3.4.10
          bundler-cache: false
      - name: Exchange the GitHub identity for a short-lived RubyGems credential
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
        with:
          trusted-publisher: true
          gem-server: https://rubygems.org
          audience: rubygems.org
      - name: Publish the verified gem
        run: gem push dist/*.gem --host https://rubygems.org
